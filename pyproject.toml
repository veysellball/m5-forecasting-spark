[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m5-forecasting-spark"
version = "0.1.0"
description = "M5 Forecasting at Scale with PySpark on Databricks & LightGBM"
authors = [{ name = "Veysel Bal" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
